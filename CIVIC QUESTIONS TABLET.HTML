<head>
    <meta charset="UTF-8">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e272c; color: #f5f6fa; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 700px; background-color: #2f3640; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); overflow: hidden; }
        .header { background-color: #c23616; padding: 20px; text-align: center; font-weight: bold; font-size: 22px; color: white; letter-spacing: 1px; }
        .credit { background-color: #192a56; padding: 6px; text-align: center; font-size: 12px; font-style: italic; color: #dcdde1; }
        .hud-panel { display: flex; justify-content: space-between; background-color: #202b38; padding: 12px 20px; font-size: 14px; border-bottom: 2px solid #3f444e; }
        .card-box { padding: 40px 30px; min-height: 140px; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .question-text { font-size: 20px; font-weight: 600; line-height: 1.5; color: #f5f6fa; }
        .control-panel { padding: 25px; background-color: #202b38; display: flex; flex-direction: column; gap: 15px; }
        .input-row { display: flex; gap: 12px; }
        input[type="text"] { flex-grow: 1; padding: 14px; font-size: 16px; border: 2px solid #718093; border-radius: 6px; background-color: #2f3640; color: white; outline: none; }
        input[type="text"]:focus { border-color: #00a8ff; }
        button { padding: 14px 28px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; }
        .btn-submit { background-color: #4cd137; color: white; }
        .btn-submit:hover { background-color: #44bd32; }
        .btn-skip { background-color: #7f8fa6; color: white; }
        .btn-skip:hover { background-color: #718093; }
        .feedback-box { padding: 15px; margin: 0 25px 25px 25px; border-radius: 6px; font-size: 14px; display: none; line-height: 1.4; }
        .feedback-success { background-color: rgba(76, 209, 55, 0.2); border: 1px solid #4cd137; color: #4cd137; }
        .feedback-error { background-color: rgba(232, 65, 24, 0.2); border: 1px solid #e84118; color: #e84118; }
    </style>
</head>

    <div class="header">USCIS CIVICS KNOWLEDGE ENGINE</div>

    <div class="hud-panel">

    </div>
    
    <div class="card-box">
        <div class="question-text" id="question-display">Loading core protocol...</div>
    </div>

    <div class="feedback-box" id="feedback-display"></div>
    
    <div class="control-panel">
        <div class="input-row">
            <input type="text" id="answer-input" placeholder="Type your response here..." autocomplete="off">
            <button class="btn-submit" id="btn-submit">SUBMIT</button>
            <button class="btn-skip" id="btn-skip">SKIP</button>
        </div>
    </div>
</div>

        { id: 63, q: "There are four amendments to the U.S. Constitution about who can vote. Describe one of them.", a: ["citizens eighteen and older can vote", "you don't have to pay a poll tax", "any citizen can vote", "a male citizen of any race"] },
        { id: 64, q: "Who can vote in federal elections, run for federal office, and serve on a jury in the United States?", a: ["citizens", "u.s. citizens", "citizens of the united states"] },
        { id: 65, q: "What are three rights of everyone living in the United States?", a: ["freedom of expression", "freedom of speech", "freedom of assembly", "freedom to petition the government", "freedom of religion", "the right to bear arms"] },

        { id: 67, q: "Name two promises that citizens make when they become U.S. citizens.", a: ["give up loyalty to other countries", "defend the constitution", "obey the laws", "serve in the military if needed", "be loyal to the united states"] },

        { id: 94, q: "What U.S. war ended slavery?", a: ["the civil war"] },
        { id: 95, q: "What amendment gives citizenship to all persons born in the United States?", a: ["14th amendment", "fourteenth amendment"] },
        { id: 96, q: "When did all men get the right to vote?", a: ["after the civil war", "15th amendment", "1870"] },
        { id: 97, q: "Susan B. Anthony is famous for many things. Name one.", a: ["fought for women's rights", "fought for civil rights", "women's suffrage"] },
        { id: 98, q: "Name one war fought by the United States in the 1900s.", a: ["world war i", "world war ii", "korean war", "vietnam war", "gulf war"] },
        { id: 99, q: "Why did the United States enter World War I?", a: ["germany attacked u.s. ships", "to support allied powers", "zimmermann telegram"] },
        { id: 100, q: "When did all women get the right to vote?", a: ["1920", "19th amendment", "after world war i"] }
    ];

    let activeIndex = 0;
    let successfulAudits = 0;
    let completedAttempts = 0;

    const qDisplay = document.getElementById('question-display');
    const ansInput = document.getElementById('answer-input');
    const submitBtn = document.getElementById('btn-submit');
    const skipBtn = document.getElementById('btn-skip');
    const hudProgress = document.getElementById('hud-progress');
    const hudScore = document.getElementById('hud-score');
    const feedbackDisplay = document.getElementById('feedback-display');

    function mountQuestion() {
        feedbackDisplay.style.display = "none";
        if (activeIndex >= civicsDatabase.length) {
            triggerFinalEvaluation();
            return;
        }
        
        const currentData = civicsDatabase[activeIndex];
        qDisplay.innerText = `${currentData.id}. ${currentData.q}`;
        hudProgress.innerText = `Question: ${activeIndex + 1} / ${civicsDatabase.length}`;
        ansInput.value = "";
        ansInput.focus();
    }

    function verifyResponse() {
        const rawGuess = ansInput.value.trim().toLowerCase();
        if (rawGuess === "") return;

        const currentData = civicsDatabase[activeIndex];
        completedAttempts++;
        
        let isCorrect = false;
        for (let i = 0; i < currentData.a.length; i++) {
            const normalizedAnswer = currentData.a[i].toLowerCase();
            if (rawGuess.includes(normalizedAnswer) || normalizedAnswer.includes(rawGuess)) {
                if (rawGuess.length >= 3 || !isNaN(rawGuess)) { 
                    isCorrect = true;
                    break;
                }
            }
        }

        if (isCorrect) {
            successfulAudits++;
            showFeedback(true, `✅ SECURE: Excellent execution! Acceptable values: "${currentData.a.join('", "')}"`);
        } else {
            showFeedback(false, `❌ INFRACTION: Mismatch detected.<br>Valid System Answers: <strong>${currentData.a.join(' | ').toUpperCase()}</strong>`);
        }

        updateMetrics();
        activeIndex++;
        setTimeout(mountQuestion, 3000);
    }

    function showFeedback(isSuccess, text) {
        feedbackDisplay.innerHTML = text;
        feedbackDisplay.className = `feedback-box ${isSuccess ? 'feedback-success' : 'feedback-error'}`;
        feedbackDisplay.style.display = "block";
    }

    function updateMetrics() {
        const percentage = completedAttempts > 0 ? ((successfulAudits / completedAttempts) * 100).toFixed(1) : 0;
        hudScore.innerText = `Current Score: ${successfulAudits}/${completedAttempts} (${percentage}%)`;
    }

    function skipItem() {
        activeIndex++;
        mountQuestion();
    }

    function triggerFinalEvaluation() {
        const finalPct = ((successfulAudits / completedAttempts) * 100).toFixed(1);
        alert(`CIVICS DEPLOYMENT COMPLETE\n\nFinal Audited Accuracy: ${successfulAudits}/${completedAttempts} (${finalPct}%)\n\nKeep pushing the precision threshold, Comrade!`);
        activeIndex = 0;
        successfulAudits = 0;
        completedAttempts = 0;
        updateMetrics();
        mountQuestion();
    }

    submitBtn.addEventListener('click', verifyResponse);
    ansInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') verifyResponse(); });
    skipBtn.addEventListener('click', skipItem);

    // Run instantly offline without waiting for web requests
    window.onload = mountQuestion;
</script>

</body>
</html>
